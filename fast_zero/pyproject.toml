[project]
name = "fast-zero"
version = "0.1.0"
description = ""
authors = [
    {name = "Hiuri Selzler",email = "hiuriselzler0@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0" 
dependencies = [
    "fastapi[standard] (>=0.128.0,<0.129.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "alembic (>=1.18.1,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "tzdata (>=2025.3,<2026.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "ruff (>=0.14.11,<0.15.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']


[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']


[tool.ruff.format]
preview = true
quote-style = 'single'


[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.taskipy.tasks]
lint = 'ruff check'
#Faz a checagem de boas práticas do código python
pre_format = 'ruff check --fix'
# Faz algumas correções de boas práticas automaticamente
format = 'ruff format'
#Executa a formatação do código em relação às convenções de estilo de código
run = 'fastapi dev fast_zero/app.py'
#executa o servidor de desenvolvimento do FastAPI
pre_test = 'task lint'
# executa a camada de lint antes de executar os testes
test = 'pytest -s -x --cov=fast_zero -vv'
#executa os testes com pytest de forma verbosa (-vv) e adiciona nosso código como base de cobertura
post_test = 'coverage html'
#gera um report de cobertura após os testes